<form class="step-form" [formGroup]="form" (ngSubmit)="onContinue()">
  <h2 class="step-form__title">Crea tu contraseña</h2>

  <div class="step-form__field">
    <label for="password" class="step-form__label">Contraseña</label>
    <div class="step-form__pw-row">
      <input
        id="password"
        [type]="showPassword() ? 'text' : 'password'"
        class="step-form__input"
        formControlName="password"
        placeholder="Mínimo 8 caracteres"
        autocomplete="new-password"
      />
      <button type="button" class="step-form__pw-toggle"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              (click)="showPassword.set(!showPassword())">
        <span class="material-icons" aria-hidden="true">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
      </button>
    </div>
    <app-password-strength-meter [password]="passwordValue" />
  </div>

  <div class="step-form__field">
    <label for="confirm" class="step-form__label">Confirmar contraseña</label>
    <div class="step-form__pw-row">
      <input
        id="confirm"
        [type]="showConfirm() ? 'text' : 'password'"
        class="step-form__input"
        formControlName="confirm"
        placeholder="Repite tu contraseña"
        autocomplete="new-password"
        [attr.aria-invalid]="confirmMismatch ? 'true' : null"
      />
      <button type="button" class="step-form__pw-toggle"
              [attr.aria-label]="showConfirm() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              (click)="showConfirm.set(!showConfirm())">
        <span class="material-icons" aria-hidden="true">{{ showConfirm() ? 'visibility_off' : 'visibility' }}</span>
      </button>
    </div>
    @if (confirmMismatch) {
      <span class="step-form__error" role="alert">Las contraseñas no coinciden.</span>
    }
  </div>

  <label class="step-form__terms">
    <input type="checkbox" formControlName="terms" class="step-form__checkbox" />
    <span>
      Acepto los
      <a href="/terminos" target="_blank" rel="noopener noreferrer" class="step-form__terms-link">Términos y Condiciones</a>
    </span>
  </label>

  @if (serverError()) {
    <p class="step-form__error step-form__error--server" role="alert">{{ serverError() }}</p>
  }

  <div class="step-form__actions">
    <button type="button" class="step-form__btn step-form__btn--back" (click)="onBack()">
      <span class="material-icons" aria-hidden="true">arrow_back</span>
      Atrás
    </button>
    <button type="submit" class="step-form__btn step-form__btn--primary"
            [disabled]="!canContinue || loading()">
      @if (loading()) {
        <span class="material-icons step-form__spin" aria-hidden="true">refresh</span>
      } @else {
        Continuar
        <span class="material-icons" aria-hidden="true">arrow_forward</span>
      }
    </button>
  </div>
</form>
