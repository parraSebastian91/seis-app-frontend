<div class="datepicker">
  <div class="datepicker__field-wrap">
    <input
      class="datepicker__input"
      [class.datepicker__input--error]="hasError"
      type="text"
      readonly
      [placeholder]="placeholder"
      [disabled]="disabled"
      [value]="displayValue"
      (click)="open()"
    />
    <button
      type="button"
      app-icon-button
      size="sm"
      class="datepicker__toggle"
      [disabled]="disabled"
      (click)="open()"
      aria-label="Abrir calendario"
    >
      <app-icon name="calendar_today" size="16" />
    </button>
  </div>

  @if (isOpen()) {
    @if (isMobile()) {
      <div class="datepicker__backdrop" (click)="close()"></div>
      <div class="datepicker__sheet" [class.datepicker__sheet--closing]="closing()">
        <div class="datepicker__handle"></div>
        <ng-container *ngTemplateOutlet="calendar"></ng-container>
      </div>
    } @else {
      <div class="datepicker__click-catcher" (click)="close()"></div>
      <div class="datepicker__panel">
        <ng-container *ngTemplateOutlet="calendar"></ng-container>
      </div>
    }
  }
</div>

<ng-template #calendar>
  <div class="datepicker__calendar" (click)="$event.stopPropagation()">
    <header class="datepicker__cal-header">
      <button type="button" app-icon-button size="sm" (click)="prevMonth()" aria-label="Mes anterior">
        <app-icon name="chevron_left" size="18" />
      </button>
      <span class="datepicker__cal-title">{{ monthLabel }}</span>
      <button type="button" app-icon-button size="sm" (click)="nextMonth()" aria-label="Mes siguiente">
        <app-icon name="chevron_right" size="18" />
      </button>
    </header>
    <div class="datepicker__weekdays">
      @for (d of weekdayLabels; track $index) {
        <span>{{ d }}</span>
      }
    </div>
    <div class="datepicker__days">
      @for (cell of calendarCells(); track cell.key) {
        <button
          type="button"
          class="datepicker__day"
          [class.is-outside]="!cell.inMonth"
          [class.is-selected]="cell.selected"
          [class.is-today]="cell.today"
          [disabled]="cell.disabled"
          (click)="selectDay(cell)"
        >
          {{ cell.day }}
        </button>
      }
    </div>
  </div>
</ng-template>
