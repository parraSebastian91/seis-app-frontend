<div
  class="collab-card"
  role="link"
  tabindex="0"
  (click)="onSelect()"
  (keydown.enter)="onSelect()"
  [attr.aria-label]="'Ver perfil de ' + colaborador.nombre + ' ' + colaborador.apellido"
>
  <!-- Avatar (Fase 2 — antes duplicaba imagen+iniciales a mano, ver AvatarComponent) -->
  <app-avatar
    [src]="colaborador.avatarUrl"
    [name]="colaborador.nombre + ' ' + colaborador.apellido"
    size="md"
  />

  <!-- Info -->
  <div class="collab-card__info">
    <span class="collab-card__name">{{ colaborador.nombre }} {{ colaborador.apellido }}</span>
    <span *ngIf="colaborador.cargo" class="collab-card__cargo">{{ colaborador.cargo }}</span>
    <span *ngIf="colaborador.grupoNombre" class="collab-card__grupo">
      <app-icon name="group" [size]="12" />
      {{ colaborador.grupoNombre }}
    </span>
  </div>
</div>
