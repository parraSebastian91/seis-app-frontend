<div
	class="card"
	[class.is-loading]="loading"
	[class.is-elevated]="elevated"
	[class.has-hover-lift]="hoverLift"
	[ngStyle]="cardStyles"
	[attr.aria-busy]="loading"
>
	<div class="card__surface">

		<!-- ── HEADER / TÍTULO — visible sólo si el slot está ocupado o hay loading ── -->
		<header class="card__header" *ngIf="hasTitle || loading">
			<ng-container *ngIf="!loading">
				<ng-content select="[card-title]"></ng-content>
			</ng-container>
			<ng-container *ngIf="loading">
				<span class="card__skeleton-bar card__skeleton-bar--title"     aria-hidden="true"></span>
				<span class="card__skeleton-bar card__skeleton-bar--subtitle"  aria-hidden="true"></span>
			</ng-container>
		</header>

		<!-- ── BODY / CONTENIDO ─────────────────────── -->
		<div class="card__body">
			<ng-container *ngIf="!loading">
				<ng-content select="[card-content]"></ng-content>
				<ng-content></ng-content>
			</ng-container>
			<ng-container *ngIf="loading">
				<span class="card__skeleton-bar"                               aria-hidden="true"></span>
				<span class="card__skeleton-bar card__skeleton-bar--md"        aria-hidden="true"></span>
				<span class="card__skeleton-bar"                               aria-hidden="true"></span>
				<span class="card__skeleton-bar card__skeleton-bar--sm"        aria-hidden="true"></span>
			</ng-container>
		</div>

		<!-- ── FOOTER — visible sólo si el slot está ocupado o hay loading ──────── -->
		<footer class="card__footer" *ngIf="hasFooter || loading">
			<ng-container *ngIf="!loading">
				<ng-content select="[card-footer]"></ng-content>
			</ng-container>
			<ng-container *ngIf="loading">
				<span class="card__skeleton-bar card__skeleton-bar--btn"       aria-hidden="true"></span>
				<span class="card__skeleton-bar card__skeleton-bar--btn"       aria-hidden="true"></span>
			</ng-container>
		</footer>

	</div>
</div>
